# ozpuzzle.devya.dev on the Devya VPS (container ozpuzzle on loopback :3198,
# docker-compose.prod.yml). Installed by `bash scripts/deploy-vps.sh --setup`;
# certbot --nginx then adds the 443 server and the http -> https redirect.
upstream ozpuzzle_web {
    server 127.0.0.1:3198;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name ozpuzzle.devya.dev;
    client_max_body_size 2m;

    location / {
        proxy_pass http://ozpuzzle_web;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
